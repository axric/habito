<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Terminal Financiera Personal — Login</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪙</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0d1117;
      --surface:  #161b22;
      --border:   #30363d;
      --border2:  #21262d;
      --green:    #3fb950;
      --red:      #f85149;
      --amber:    #e3b341;
      --blue:     #58a6ff;
      --purple:   #bc8cff;
      --text:     #c9d1d9;
      --muted:    #8b949e;
      --muted2:   #6e7681;
      --font:     'Fira Code', monospace;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .terminal {
      width: 100%;
      max-width: 420px;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      margin: 16px;
    }

    /* header */
    .term-header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .dots { display: flex; gap: 5px; }
    .dot  { width: 11px; height: 11px; border-radius: 50%; }
    .dot-r { background: #ff5f57; }
    .dot-y { background: #ffbd2e; }
    .dot-g { background: #28c840; }
    .term-title {
      font-size: 11px;
      color: var(--muted);
      flex: 1;
      text-align: center;
      letter-spacing: .06em;
    }
    .term-version {
      font-size: 9px;
      color: var(--muted2);
    }

    /* body */
    .term-body {
      padding: 28px 24px 32px;
      background: var(--bg);
    }

    .prompt-line {
      font-size: 10px;
      color: var(--muted);
      margin-bottom: 20px;
    }
    .prompt-line .ps { color: var(--green); }
    .prompt-line .pc { color: var(--blue); }

    /* form */
    .field {
      margin-bottom: 14px;
    }
    .field label {
      display: block;
      font-size: 8px;
      color: var(--muted2);
      letter-spacing: .1em;
      text-transform: uppercase;
      margin-bottom: 5px;
    }
    .field input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 4px;
      color: var(--text);
      font-family: var(--font);
      font-size: 12px;
      padding: 8px 11px;
      outline: none;
      transition: border-color .15s;
    }
    .field input:focus {
      border-color: var(--blue);
    }
    .field input::placeholder {
      color: var(--muted2);
    }

    /* error */
    .error-box {
      display: none;
      background: rgba(248,81,73,.08);
      border: 1px solid rgba(248,81,73,.25);
      border-radius: 4px;
      padding: 7px 10px;
      font-size: 9px;
      color: var(--red);
      margin-bottom: 14px;
      line-height: 1.5;
    }
    .error-box.visible { display: block; }

    /* submit */
    .btn-login {
      width: 100%;
      background: transparent;
      border: 1px solid var(--green);
      border-radius: 4px;
      color: var(--green);
      font-family: var(--font);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .08em;
      padding: 9px;
      cursor: pointer;
      transition: background .15s, color .15s;
      margin-top: 4px;
    }
    .btn-login:hover {
      background: rgba(63,185,80,.1);
    }
    .btn-login:disabled {
      opacity: .4;
      cursor: not-allowed;
    }
    .btn-login .spinner {
      display: none;
      animation: spin .7s linear infinite;
    }
    .btn-login.loading .spinner  { display: inline-block; }
    .btn-login.loading .btn-text { display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* footer */
    .term-footer {
      padding: 10px 14px;
      border-top: 1px solid var(--border2);
      font-size: 7px;
      color: var(--muted2);
      opacity: .5;
      text-align: center;
      letter-spacing: .03em;
    }
  </style>
</head>
<body>

<div class="terminal">

  <div class="term-header">
    <div class="dots">
      <div class="dot dot-r"></div>
      <div class="dot dot-y"></div>
      <div class="dot dot-g"></div>
    </div>
    <div class="term-title">TERMINAL FINANCIERA PERSONAL</div>
    <div class="term-version">v0.2.0</div>
  </div>

  <div class="term-body">

    <div class="prompt-line">
      <span class="ps">❯</span> <span class="pc">auth --method email --session start</span>
    </div>

    <form id="login-form" autocomplete="off" onsubmit="handleLogin(event)">

      <div class="field">
        <label>email</label>
        <input
          id="email"
          type="email"
          placeholder="usuario@email.com"
          required
          autocomplete="email"
        >
      </div>

      <div class="field">
        <label>contraseña</label>
        <input
          id="password"
          type="password"
          placeholder="••••••••••••"
          required
          autocomplete="current-password"
        >
      </div>

      <div class="error-box" id="error-box"></div>

      <button class="btn-login" id="btn-login" type="submit" disabled>
        <span class="btn-text">▸ &nbsp;iniciar sesión</span>
        <span class="spinner">↻</span>
      </button>

    </form>

  </div>

  <div class="term-footer">
    acceso restringido · solo usuarios autorizados
  </div>

</div>

<script type="module">
  const btn = document.getElementById('btn-login');
  const errorBox = document.getElementById('error-box');
  let signIn;

  window.handleLogin = async function(event) {
    event.preventDefault();
    if (!signIn) return;

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    errorBox.textContent = '';
    errorBox.classList.remove('visible');
    btn.classList.add('loading');
    btn.disabled = true;

    try {
      const result = await signIn(email, password);
      if (result.error) throw new Error(result.error);
      if (!result.user) throw new Error('No se pudo iniciar sesión.');
      window.location.assign('/dashboard');
    } catch (error) {
      console.error('Login failed.', error);
      errorBox.textContent = '▸ ' + (error.message || 'No se pudo iniciar sesión.');
      errorBox.classList.add('visible');
      btn.classList.remove('loading');
      btn.disabled = false;
    }
  };

  try {
    const auth = await import('/js/auth.js');
    signIn = auth.signIn;
    if (await auth.getSession()) {
      window.location.replace('/dashboard');
    } else {
      btn.disabled = false;
    }
  } catch (error) {
    console.error('Unable to initialize Supabase auth.', error);
    errorBox.textContent = '▸ ' + (error.message || 'No se pudo iniciar el servicio de autenticación.');
    errorBox.classList.add('visible');
    btn.disabled = true;
  }
</script>

</body>
</html>
